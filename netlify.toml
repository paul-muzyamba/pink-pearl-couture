# ================================================================
#  Pink Pearl Couture ZM — Netlify Configuration
#  File: netlify.toml
#
#  Place this file in the ROOT of your repository.
#  Netlify reads it automatically on every deploy.
# ================================================================

[build]
  # No build command needed — pure static site
  publish = "."

# ── Clean URLs ──────────────────────────────────────────────────
# Allows /on-sale and /admin to work without the .html extension
[[redirects]]
  from   = "/on-sale"
  to     = "/on-sale.html"
  status = 200

[[redirects]]
  from   = "/admin"
  to     = "/admin.html"
  status = 200

# ── Security headers (applied to every page) ───────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ── Cache static assets aggressively ───────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Never cache HTML pages (always fresh) ──────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
