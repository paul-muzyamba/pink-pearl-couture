<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>🔥 ON SALE! — Pink Pearl Couture ZM</title>

  <meta
    name="description"
    content="Shop currently available dresses, shoes, handbags, suits and more at Pink Pearl Couture ZM."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="./assets/css/on-sale.css" />
</head>

<body>

    <!-- ON SALE NAVBAR -->
<nav class="sale-nav">

  <div class="sale-nav__inner">

    <a href="./index.html" class="sale-nav__logo">
      PINK <span>PEARL</span>
    </a>

    <div class="sale-nav__links">

      <a href="./index.html">
        Home
      </a>

      <a href="./index.html#catalogue">
        Collection
      </a>

      <a href="./index.html#about">
        About
      </a>

      <a href="./index.html#locations">
        Stores
      </a>

      <a href="./index.html#contact">
        Contact
      </a>

    </div>

    <a
      href="https://wa.me/260979690009"
      target="_blank"
      class="sale-nav__cta"
    >
      💬 WhatsApp
    </a>

  </div>

</nav>

<div class="sale-hero">
  <div class="sale-hero__overlay"></div>

  <div class="sale-hero__content">
    <div class="sale-pill">
      LIMITED STOCK · READY TO BUY
    </div>

    <h1>
      🔥 HOT RIGHT NOW!
    </h1>

    <p>
      Browse currently available fashion pieces in-store before they're gone...
    </p>
  </div>
</div>

<section class="sale-search">

  <div class="sale-search__top">

    <div class="sale-search__title">
      Search Available Stock
    </div>

    <div class="sale-search__subtitle">
      Filter by category
    </div>

  </div>

  <div class="filters">

    <label class="filter-item">
      <input type="checkbox" value="dresses" checked />
      Dresses
    </label>

    <label class="filter-item">
      <input type="checkbox" value="tops" checked />
      Tops
    </label>

    <label class="filter-item">
      <input type="checkbox" value="skirts" checked />
      Skirts / Bottoms
    </label>

    <label class="filter-item">
      <input type="checkbox" value="suits" checked />
      Suits
    </label>

    <label class="filter-item">
      <input type="checkbox" value="bags" checked />
      Handbags & Purses
    </label>

    <label class="filter-item">
      <input type="checkbox" value="shoes" checked />
      Shoes
    </label>

    <label class="filter-item">
      <input type="checkbox" value="sandals" checked />
      Sandals & Slides
    </label>

    <label class="filter-item">
      <input type="checkbox" value="all" checked />
      All
    </label>

  </div>

  <div class="stock-grid" id="stockGrid"></div>

</section>

<script src="./assets/data/stock.js"></script>
<script src="./assets/js/on-sale.js"></script>

</body>
</html>
